name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  WEB_IMAGE_NAME: devops-web
  NGINX_IMAGE_NAME: devops-nginx

jobs:
  validate-runner:
    name: Validate self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate runner and tools
        run: |
          echo "Validando self-hosted runner..."
          echo "Repositorio clonado correctamente"

          echo "Directorio actual:"
          pwd

          echo "Archivos del repositorio:"
          ls -la

          echo "Sistema operativo:"
          uname -a || true

          echo "Docker version:"
          docker --version

          echo "Docker compose version:"
          docker compose version

          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Kubectl version:"
          kubectl version --client || true

          echo "Minikube version:"
          minikube version || true

          echo "Validación finalizada correctamente"
  node-tests:
    name: Install dependencies and run Node.js tests
    runs-on: self-hosted
    needs: validate-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./web
        run: |
          echo "Instalando dependencias de Node.js..."
          npm install

      - name: Run tests
        working-directory: ./web
        run: |
          echo "Ejecutando pruebas unitarias..."
          npm test
  sonarqube-analysis:
    name: SonarQube analysis
    runs-on: self-hosted
    needs: node-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
  
  docker-build-push:
    name: Build and push Docker images
    runs-on: self-hosted
    needs: sonarqube-analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker
        run: |
          echo "Validando Docker..."
          docker --version
          docker compose version

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Web image
        run: |
          echo "Construyendo imagen Web..."
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:${{ github.run_number }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:latest \
            ./web

      - name: Build Nginx image
        run: |
          echo "Construyendo imagen Nginx..."
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.run_number }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE_NAME }}:latest \
            ./nginx

      - name: Push Web image
        run: |
          echo "Subiendo imagen Web a DockerHub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:latest

      - name: Push Nginx image
        run: |
          echo "Subiendo imagen Nginx a DockerHub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE_NAME }}:latest

      - name: Show local Docker images
        run: |
          echo "Imágenes generadas:"
          docker images | grep -E "${{ env.WEB_IMAGE_NAME }}|${{ env.NGINX_IMAGE_NAME }}" || true
          